function exportStatsImage(sd,ed){
  const me=getMe();
  if(!me){showToast('请先设置本人');return null;}
  const statMarks=statCountEnabled();
  const months=[];
  let cursor=new Date(sd.getFullYear(),sd.getMonth(),1);
  const endM=new Date(ed.getFullYear(),ed.getMonth(),1);
  while(cursor<=endM){
    months.push({y:cursor.getFullYear(),m:cursor.getMonth()+1});
    cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1);
  }
  if(!months.length){showToast('时间段无效');return null;}
  function calcMonth(y,mm){
    const dm=new Date(y,mm,0).getDate();
    let should=0;const markCounts={};
    statMarks.forEach(mk=>markCounts[mk.id]=0);
    for(let d=1;d<=dm;d++){
      const date=new Date(y,mm-1,d);
      const sh=calcPersonShift(me,date);
      const isRest=!sh||sh.name==='休息'||sh.name==='休班';
      if(!isRest)should++;
      const marks=getMarksForDate(date);
      marks.forEach(mid=>{if(markCounts[mid]!==undefined)markCounts[mid]++;});
    }
    return {should,markCounts};
  }
  const rowsData=months.map(mo=>({label:mo.y+'年'+mo.m+'月',...calcMonth(mo.y,mo.m)}));
  let totalShould=0;const totalMC={};
  statMarks.forEach(mk=>totalMC[mk.id]=0);
  rowsData.forEach(r=>{totalShould+=r.should;statMarks.forEach(mk=>totalMC[mk.id]+=r.markCounts[mk.id]);});
  function actualOf(r){let a=r.should;statMarks.forEach(mk=>{if(mk.id==='overtime')a+=r.markCounts[mk.id];else a-=r.markCounts[mk.id];});return Math.max(0,a);}
  let totalActual=totalShould;
  statMarks.forEach(mk=>{if(mk.id==='overtime')totalActual+=totalMC[mk.id];else totalActual-=totalMC[mk.id];});
  totalActual=Math.max(0,totalActual);
  const cols=1+1+statMarks.length+1;
  const cellW=Math.max(78,Math.min(96,Math.floor(560/cols)));
  const cellH=30,padX=20,padY=20,titleH=36,headerH=32;
  const width=padX*2+cellW*cols;
  const height=padY*2+titleH+headerH+(rowsData.length+1)*cellH;
  const {canvas,ctx}=_expCtx(width,height);
  ctx.fillStyle='#1e293b';ctx.font='bold 18px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillText(_expTitleRange(sd,ed,'考勤统计'),width/2,padY+18);
  let yy=padY+titleH;
  const headers=['月份','应上班'].concat(statMarks.map(m=>m.name)).concat(['实际上班']);
  headers.forEach((h,i)=>{const x=padX+i*cellW;_expCell(ctx,x,yy,cellW,headerH,h,{bg:'#f1f5f9',bold:true,fontSize:11});});
  yy+=headerH;
  rowsData.forEach((r,i)=>{
    const row=[r.label,r.should].concat(statMarks.map(mk=>r.markCounts[mk.id])).concat([actualOf(r)]);
    row.forEach((v,j)=>{
      const x=padX+j*cellW;
      let col='#1e293b';
      if(j===1)col='#2563eb';
      else if(j===row.length-1)col='#10b981';
      else if(j>1)col='#ef4444';
      _expCell(ctx,x,yy,cellW,cellH,v,{color:col,bold:j>0,fontSize:12});
    });
    yy+=cellH;
  });
  const sumRow=['小计',totalShould].concat(statMarks.map(mk=>totalMC[mk.id])).concat([totalActual]);
  sumRow.forEach((v,j)=>{const x=padX+j*cellW;_expCell(ctx,x,yy,cellW,cellH,v,{bg:'#f0f7ff',color:'#2563eb',bold:true,fontSize:12});});
  return canvas.toDataURL('image/png');
}

/* ============ 主渲染 ============ */
function render(){
  const scrollTop=document.getElementById('page').scrollTop;
  renderTopbar();
  const p=document.getElementById('page');
  if(state.page==='home'){p.innerHTML=state.view==='week'?renderWeek():renderMonth();attachHomeGestures();}
  else if(state.page==='stats')p.innerHTML=renderStats();
  else if(state.page==='compare'){p.innerHTML=renderCompare();attachCompareGestures();}
  else if(state.page==='profile')p.innerHTML=renderProfile();
  else if(state.page==='schedule')p.innerHTML=renderScheduleManage();
  else if(state.page==='personnel')p.innerHTML=renderPersonnel();
  else if(state.page==='overview'){p.innerHTML=renderOverview();attachOverviewGestures();}
  else if(state.page==='sidebar'){p.innerHTML=renderSidebarPage();attachSidebarGestures();}
  else if(state.page==='help')p.innerHTML=renderHelp();
  else if(state.page==='about')p.innerHTML=renderAbout();
  renderTabbar();
  p.scrollTop=scrollTop;
}
function renderTopbar(){
  const tb=document.getElementById('topbar');
  let right='';
  if(state.page==='home')right='<button class="tb-btn" onclick="openExport(\'current\')">导出</button>';
  else if(state.page==='compare')right='<button class="tb-btn" onclick="openExport(\'compare\')">导出</button>';
  else if(state.page==='overview'||state.page==='sidebar')right='<button class="tb-btn" onclick="openExport(\'overview\')">导出</button>';
  else if(state.page==='stats')right='<button class="tb-btn" onclick="openExport(\'stats\')">导出</button>';
  tb.innerHTML='<button class="tb-menu" onclick="openDrawer()">'+IC.menu+'</button><div>'+right+'</div>';
}
function renderTabbar(){
  const tabs=[
    {id:'home',name:'首页',icon:IC.home},
    {id:'stats',name:'统计',icon:IC.stats},
    {id:'compare',name:'对比',icon:IC.compare},
    {id:'overview',name:'班次总览',icon:IC.overview}
  ];
  document.getElementById('tabbar').innerHTML=tabs.map(t=>'<button class="'+(state.page===t.id?'active':'')+'" onclick="switchPage(\''+t.id+'\')">'+t.icon+'<span>'+t.name+'</span></button>').join('');
}
function switchPage(p){
  state.page=p;
  if(p==='home'||p==='compare'||p==='overview'){state.date=new Date();state.selectedDate=new Date();}
  render();
}
function openDrawer(){document.getElementById('drawer').classList.add('active');document.getElementById('drawerBg').classList.add('active');renderDrawer();}
function closeDrawer(){document.getElementById('drawer').classList.remove('active');document.getElementById('drawerBg').classList.remove('active');}
function renderDrawer(){
  const me=getMe();const dr=document.getElementById('drawer');
  const avatarHtmlStr=me?avatarHtml({avatar:me.avatar,name:me.name,nameColor:me.nameColor||state.theme.primary,frame:me.frame,size:56,fontSize:22}):'<div style="width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px">?</div>';
  const tableLabel=(state.sidebarTable&&state.sidebarTable.name)?state.sidebarTable.name:'班次总览';
  const subStyle=(me&&me.posColor?colorStyle(me.posColor):'')+';font-size:16px;font-weight:600';
  dr.innerHTML='<div class="dr-head">'+
    '<div class="dr-toolbar left"><button onclick="toggleDark()">'+(state.theme.dark?'☀️':'🌙')+'</button></div>'+
    '<div class="dr-toolbar right"><button onclick="openThemePanel()">🎨</button></div>'+
    '<div class="dr-avatar">'+avatarHtmlStr+'</div>'+
    '<div class="dr-name" style="'+(me&&me.nameColor?colorStyle(me.nameColor):'')+'">'+(me?me.name:'未设置本人')+'</div>'+
    '<div class="dr-sub" style="'+subStyle+'">'+(me?(me.position||'无岗位'):'请先添加人员')+'</div>'+
    '<div class="dr-spark"></div>'+
  '</div>'+
  '<div class="dr-menu">'+
    '<button onclick="drawerGo(\'schedule\')">'+IC.schedule+'排班管理</button>'+
    '<button onclick="drawerGo(\'personnel\')">'+IC.people+'人员管理</button>'+
    '<button onclick="drawerGo(\'profile\')">'+IC.profile+'我的资料</button>'+
    '<button onclick="drawerGo(\'sidebar\')">'+IC.overview+tableLabel+'</button>'+
    '<button onclick="drawerGo(\'help\')">'+IC.help+'帮助</button>'+
    '<button onclick="drawerGo(\'about\')">'+IC.info+'关于本系统</button>'+
    '<button onclick="closeDrawer();openClearDataModal()" style="color:var(--r)">'+IC.info+'清除数据</button>'+
  '</div>';
}
function drawerGo(p){
  closeDrawer();
  state.page=p;
  if(p==='home'||p==='compare'||p==='overview'||p==='sidebar'){state.date=new Date();state.selectedDate=new Date();}
  render();
}
function toggleDark(){
  state.theme.dark=!state.theme.dark;
  applyTheme();save();render();
  if(document.getElementById('drawer').classList.contains('active'))renderDrawer();
}

/* ============ 主题 ============ */
function themePanelHtml(){
  const t=state.theme;
  let html='<div class="modal-head"><h3>主题设置</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">';
  
  const isPrimaryDefault = colorToCss(t.primary) === '#2563eb';
  html+='<div class="setting-group"><div class="setting-label">主题色（纯色）</div><div class="preview-card"><div class="pv-label">主题色</div><div class="pv-value" style="'+colorBgStyle(t.primary)+';flex:1" onclick="pickThemeColor(\'primary\')">Aa</div>'+
    (!isPrimaryDefault?'<div class="pv-actions"><button class="icon-btn" onclick="resetThemeColor(\'primary\')">↺</button></div>':'')+'</div></div>';
    
  const isBorderDefault = colorToCss(t.calBorder) === 'transparent';
  html+='<div class="setting-group"><div class="setting-label">日历总边框（纯色）</div><div class="preview-card"><div class="pv-label">总边框</div><div class="pv-value" style="'+colorBgStyle(t.calBorder)+';flex:1" onclick="pickThemeColor(\'calBorder\')">Aa</div>'+
    (!isBorderDefault?'<div class="pv-actions"><button class="icon-btn" onclick="resetThemeColor(\'calBorder\')">↺</button></div>':'')+'</div></div>';
    
  const isCellBorderDefault = colorToCss(t.calCellBorder) === 'transparent';
  html+='<div class="setting-group"><div class="setting-label">日历单元格边框（纯色）</div><div class="preview-card"><div class="pv-label">单元格</div><div class="pv-value" style="'+colorBgStyle(t.calCellBorder)+';flex:1" onclick="pickThemeColor(\'calCellBorder\')">Aa</div>'+
    (!isCellBorderDefault?'<div class="pv-actions"><button class="icon-btn" onclick="resetThemeColor(\'calCellBorder\')">↺</button></div>':'')+'</div></div>';
    
  html+='</div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">关闭</button><button class="btn" onclick="save();showToast(\'已保存\');closeModal()">保存</button></div>';
  return html;
}
function openThemePanel(){pushModal(themePanelHtml());}
function pickThemeColor(key){
  openColorPicker(key==='primary'?'主题色':(key==='calBorder'?'总边框':'单元格边框'), state.theme[key], function(c){
    state.theme[key]=c;applyTheme();save();render();
    updateTopLayer(themePanelHtml());
  }, true);
}
function resetThemeColor(key){
  const defaults = {primary:C('#2563eb'), calBorder:C('transparent'), calCellBorder:C('transparent')};
  state.theme[key] = defaults[key];
  applyTheme(); save(); render(); updateTopLayer(themePanelHtml());
}
