<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>轮班日历</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--p:#2563eb;--pd:#1d4ed8;--g:#10b981;--o:#f59e0b;--r:#ef4444;--bg:#f8fafc;--cd:#fff;--t:#1e293b;--t2:#64748b;--bd:#e2e8f0;--rd:8px;--cal-border:transparent;--cal-cell-border:transparent}
body.dark{--bg:#0f172a;--cd:#1e293b;--t:#f1f5f9;--t2:#94a3b8;--bd:#334155}
body.dark #topbar{background:linear-gradient(135deg,#1e3a8a 0%,#172554 100%)!important}
body.dark #drawer .dr-head{background:linear-gradient(135deg,#1e3a8a 0%,#172554 100%)!important}
body.dark #tabbar{background:var(--cd)}
body.dark .modal-sheet,body.dark .modal-head,body.dark .modal-foot{background:var(--cd);color:var(--t)}
body.dark .pick-item{background:rgba(37,99,235,.12)}
body.dark .pick-item.selected{background:rgba(37,99,235,.25)}
body.dark .setting-group{background:rgba(37,99,235,.1)}
body.dark .inp{background:var(--cd);color:var(--t);border-color:var(--bd)}
body.dark .btn.ghost{background:rgba(37,99,235,.15);color:var(--t)}
body.dark .icon-btn{background:rgba(37,99,235,.15)}
body.dark .preview-card{background:rgba(37,99,235,.12)}
html,body{height:100%;overflow:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);font-size:14px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
#app{display:flex;flex-direction:column;height:100vh;max-width:640px;margin:0 auto;position:relative}
#topbar{background:linear-gradient(135deg,var(--p) 0%,var(--pd) 100%);color:#fff;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding-top:calc(12px + env(safe-area-inset-top));box-shadow:0 2px 8px rgba(37,99,235,.2)}
#topbar .tb-menu{background:none;border:none;color:#fff;cursor:pointer;padding:4px 6px;display:flex;align-items:center;border-radius:8px}
#topbar .tb-menu:active{transform:scale(.9);background:rgba(255,255,255,.15)}
#topbar .tb-menu svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
#topbar .tb-btn{background:rgba(255,255,255,.18);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}
#topbar .tb-btn:active{transform:scale(.94);background:rgba(255,255,255,.3)}
#page{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;position:relative;display:flex;flex-direction:column}
#tabbar{display:flex;background:var(--cd);border-top:1px solid var(--bd);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom)}
#tabbar button{flex:1;background:none;border:none;padding:8px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--t2);font-size:10px}
#tabbar button:active{transform:scale(.92)}
#tabbar button.active{color:var(--p);font-weight:600}
#tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#drawerBg{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:900;display:none}
#drawerBg.active{display:block}
#drawer{position:fixed;top:0;left:0;bottom:0;width:260px;background:var(--cd);z-index:901;transform:translateX(-100%);transition:transform .25s ease;display:flex;flex-direction:column;color:var(--t)}
#drawer.active{transform:translateX(0)}
#drawer .dr-head{padding:calc(20px + env(safe-area-inset-top)) 20px 20px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;position:relative;overflow:hidden;border-bottom:1px solid rgba(255,255,255,.15);text-align:center}
#drawer .dr-head::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.4) 45%,rgba(255,255,255,.08) 60%,rgba(255,255,255,0) 85%);pointer-events:none}
#drawer .dr-head::after{content:'';position:absolute;top:-40%;left:-20%;width:60%;height:180%;background:radial-gradient(ellipse at center,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 60%);pointer-events:none;transform:rotate(-20deg)}
#drawer .dr-head > *{position:relative;z-index:1}
#drawer .dr-head .dr-name{font-size:16px;font-weight:600;margin-top:8px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
#drawer .dr-head .dr-sub{font-size:12px;opacity:.9;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.1)}
#drawer .dr-avatar{display:flex;align-items:center;justify-content:center;position:relative;z-index:2}
#drawer .dr-toolbar{position:absolute;top:calc(12px + env(safe-area-inset-top));display:flex;gap:6px;z-index:3}
#drawer .dr-toolbar.left{left:12px}
#drawer .dr-toolbar.right{right:12px}
#drawer .dr-toolbar button{background:rgba(255,255,255,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.3);width:32px;height:32px;border-radius:8px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
#drawer .dr-toolbar button:active{transform:scale(.9);background:rgba(255,255,255,.4)}
#drawer .dr-head .dr-spark{position:absolute;right:8px;bottom:6px;width:52px;height:52px;pointer-events:none;z-index:2}
#drawer .dr-head .dr-spark::before,
#drawer .dr-head .dr-spark::after{content:'';position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,255,255,.45) 35%,rgba(255,255,255,0) 72%);animation:drSparkAnim 2.6s infinite ease-in-out}
#drawer .dr-head .dr-spark::before{width:26px;height:26px;right:0;bottom:0}
#drawer .dr-head .dr-spark::after{width:12px;height:12px;right:26px;bottom:26px;animation-delay:1.3s}
@keyframes drSparkAnim{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1.25)}}
#drawer .dr-menu{flex:1;overflow-y:auto;padding:8px 0}
#drawer .dr-menu button{width:100%;background:none;border:none;padding:14px 20px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--t);cursor:pointer;text-align:left}
#drawer .dr-menu button:active{background:rgba(37,99,235,.08)}
#drawer .dr-menu button svg{width:20px;height:20px;stroke:var(--p);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--cd);border-radius:var(--rd);padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card-title{font-size:14px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;color:var(--t);gap:8px;flex-wrap:wrap}
.card-title.nonwrap{flex-wrap:nowrap}
.btn{background:var(--p);color:#fff;border:none;border-radius:6px;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn:active{transform:scale(.95);opacity:.85}
.btn.sm{padding:6px 10px;font-size:12px}
.btn.block{width:100%;padding:11px}
.btn.ghost{background:rgba(37,99,235,.08);color:var(--t)}
.btn.red{background:var(--r)}
.inp{width:100%;border:1px solid var(--bd);border-radius:6px;padding:9px 11px;font-size:14px;background:var(--cd);color:var(--t);outline:none}
.inp:focus{border-color:var(--p)}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--t2);margin-bottom:5px;font-weight:500}
.row{display:flex;gap:8px}.row>*{flex:1}
.month-nav{display:flex;align-items:center;justify-content:space-between;background:var(--cd);border-radius:var(--rd);padding:8px 10px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);border:1px solid var(--cal-border)}
.month-nav .mn-title{font-size:14px;font-weight:600;color:var(--t)}
.month-nav button{background:rgba(37,99,235,.08);border:none;width:32px;height:32px;border-radius:6px;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--t)}
.month-nav button:active{transform:scale(.9);background:rgba(37,99,235,.18)}
.month-nav .mn-today,.month-nav .mn-month{background:var(--p);color:#fff;padding:5px 12px;border-radius:6px;border:none;font-size:12px;font-weight:500;cursor:pointer;width:auto;height:auto}
.month-nav .mn-month{background:rgba(37,99,235,.08);color:var(--t)}
.weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:4px}
.weekdays div{text-align:center;font-size:11px;font-weight:600;color:var(--t2);padding:5px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;touch-action:pan-y;border:1px solid var(--cal-border);border-radius:var(--rd);padding:3px;background:var(--cd)}
.cal-cell{background:var(--cd);border-radius:6px;min-height:56px;padding:3px 3px 2px;display:flex;flex-direction:column;position:relative;cursor:pointer;overflow:hidden;border:1px solid var(--cal-cell-border);user-select:none;-webkit-user-select:none}
.cal-cell:active{transform:scale(.96)}
.cal-cell *{pointer-events:none}
.cal-cell.empty{background:transparent;cursor:default;pointer-events:none;border-color:transparent}
.cal-cell .cal-head{display:flex;justify-content:space-between;align-items:baseline;padding:0 1px;gap:2px;min-width:0}
.cal-cell .cal-num{font-weight:600;line-height:1.1;color:var(--t);flex-shrink:0}
.cal-cell .cal-sub{line-height:1;white-space:nowrap;text-align:right;flex:1 1 auto;min-width:0;color:var(--t2)}
.cal-cell .cal-sub.holiday{color:var(--r);font-weight:600}
.cal-cell .cal-shift-mid{flex:1;display:flex;align-items:center;justify-content:center;font-weight:700;line-height:1}
.cal-cell.sel{background:var(--p)!important;border-color:var(--p)!important}
.cal-cell.sel .cal-num,.cal-cell.sel .cal-sub,.cal-cell.sel .cal-shift-mid{color:#fff!important}
.cal-cell.today-marked{background:var(--p)!important;border-color:var(--p)!important}
.cal-cell.today-marked .cal-num,.cal-cell.today-marked .cal-sub,.cal-cell.today-marked .cal-shift-mid{color:#fff!important}
.cal-cmp-name{font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hint-list{margin-top:8px;font-size:11px;color:var(--t2);line-height:1.7}
.month-bottom{margin-top:auto;padding-top:12px}
.person-scroll{display:flex;gap:10px;overflow-x:auto;padding:9px 6px 10px}
.person-scroll::-webkit-scrollbar{display:none}
.person-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:60px;position:relative}
.person-chip:active{transform:scale(.92)}
.person-chip .pc-name{font-size:11px;color:var(--t);font-weight:500;max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.person-chip.checked .avatar-wrap::after{content:'';position:absolute;left:50%;top:50%;width:132%;height:132%;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--p);pointer-events:none;z-index:10;box-sizing:border-box}
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-end;justify-content:center;z-index:1000}
.modal-sheet{background:var(--cd);width:100%;max-width:640px;border-radius:16px 16px 0 0;max-height:88vh;overflow-y:auto;padding-bottom:env(safe-area-inset-bottom)}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:var(--cd);z-index:2}
.modal-head h3{font-size:15px;font-weight:600;color:var(--t)}
.modal-head .close{background:none;border:none;font-size:22px;color:var(--t2);cursor:pointer;padding:0 4px;line-height:1}
.modal-body{padding:14px 16px}
.modal-foot{padding:12px 16px;display:flex;gap:8px;border-top:1px solid var(--bd);position:sticky;bottom:0;background:var(--cd)}
.modal-foot .btn{flex:1}
.modal-bg.layer{background:rgba(15,23,42,.4);z-index:1100}
.pick-item{display:flex;align-items:center;gap:10px;padding:11px;border-radius:8px;background:rgba(37,99,235,.05);cursor:pointer;border:2px solid transparent;margin-bottom:6px}
.pick-item:active{transform:scale(.98)}
.pick-item.selected{border-color:var(--p);background:rgba(37,99,235,.12)}
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600}
.divider{height:1px;background:var(--bd);margin:10px 0}
.empty{text-align:center;padding:24px 12px;color:var(--t2);font-size:13px}
.empty .em-icon{font-size:36px;margin-bottom:8px;opacity:.5}
.icon-btn{background:rgba(37,99,235,.08);border:none;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--t2)}
.icon-btn:active{transform:scale(.88);background:rgba(37,99,235,.18)}
.icon-btn.red{background:rgba(239,68,68,.15);color:var(--r)}
.shift-item{display:flex;align-items:center;gap:10px;padding:11px;background:var(--cd);border-radius:var(--rd);margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.stat-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.stat-card{background:var(--cd);border-radius:var(--rd);padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.06);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:76px}
.stat-card .sv{font-size:20px;font-weight:700;color:var(--p)}
.stat-card .sl{font-size:10px;color:var(--t2);margin-top:2px}
.stat-card.green .sv{color:var(--g)}.stat-card.orange .sv{color:var(--o)}.stat-card.red .sv{color:var(--r)}
.stat-multi{display:flex;justify-content:space-around;align-items:center;width:100%;gap:4px;flex-wrap:wrap}
.stat-multi > div{flex:1;text-align:center;min-width:0}
.stat-multi .sv{font-size:18px;font-weight:700}
.stat-multi .sl{font-size:10px;color:var(--t2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar-pick{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.avatar-pick div{width:48px;height:48px;border-radius:50%;overflow:hidden;cursor:pointer;border:2px solid var(--bd);position:relative}
.avatar-pick div.selected{border-color:var(--p);box-shadow:0 0 0 2px rgba(37,99,235,.2)}
.avatar-pick img{width:100%;height:100%;object-fit:cover}
.team-cal-cell{background:var(--cd);border-radius:6px;min-height:64px;padding:2px;display:flex;flex-direction:column;cursor:pointer;overflow:hidden;border:1px solid var(--cal-cell-border)}
.team-cal-cell:active{transform:scale(.96)}
.team-cal-cell .tc-head{display:flex;justify-content:space-between;font-weight:600;padding:0 1px;color:var(--t);gap:2px;min-width:0}
.team-cal-cell .tc-head .tc-sub{font-weight:400;white-space:nowrap;text-align:right;flex:1 1 auto;min-width:0;color:var(--t2)}
.team-cal-cell .tc-head .tc-sub.holiday{color:var(--r);font-weight:600}
.team-cal-cell .tc-row{display:flex;justify-content:space-between;padding:0 2px;line-height:1.4;border-top:1px solid var(--bd);gap:2px}
.team-cal-cell .tc-row span:first-child{flex-shrink:0}
.team-cal-cell .tc-row span:last-child{flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.team-cal-cell.sel{background:var(--p)!important;border-color:var(--p)!important}
.team-cal-cell.sel .tc-head,.team-cal-cell.sel .tc-head .tc-sub,.team-cal-cell.sel .tc-row{color:#fff!important}
.team-cal-cell.sel .tc-row{border-top-color:rgba(255,255,255,.3)}
.team-cal-cell.today-marked{background:var(--p)!important;border-color:var(--p)!important}
.team-cal-cell.today-marked .tc-head,.team-cal-cell.today-marked .tc-head .tc-sub,.team-cal-cell.today-marked .tc-row{color:#fff!important}
.team-cal-cell.empty{background:transparent;pointer-events:none;border-color:transparent}
.color-swatch{width:34px;height:34px;border-radius:50%;cursor:pointer;border:3px solid transparent;flex-shrink:0}
.color-swatch:active{transform:scale(.9)}
.color-swatch.selected{border-color:var(--t)}
.setting-group{background:rgba(37,99,235,.04);border-radius:8px;padding:10px;margin-bottom:10px}
.setting-label{font-size:11px;color:var(--t2);margin-bottom:5px;font-weight:500}
.setting-options{display:flex;gap:6px;flex-wrap:wrap}
.setting-options button{background:rgba(37,99,235,.08);border:1px solid transparent;border-radius:5px;padding:4px 9px;font-size:11px;cursor:pointer;color:var(--t)}
.setting-options button.sel{background:var(--p);color:#fff}
.checkbox-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.checkbox-row input[type=checkbox]{width:18px;height:18px}
.checkbox-row label{font-size:13px;color:var(--t);flex:1}
.preview-card{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(37,99,235,.04);border-radius:8px;margin-bottom:8px;cursor:pointer;border:2px solid transparent}
.preview-card:active{border-color:var(--p)}
.preview-card.selected{border-color:var(--p);background:rgba(37,99,235,.12)}
.preview-card .pv-label{font-size:13px;font-weight:600;color:var(--t);flex:0 0 auto;min-width:44px}
.preview-card .pv-value{flex:1;text-align:center;padding:6px 12px;border-radius:6px;font-weight:700;min-width:60px}
.preview-card .pv-time{font-size:11px;color:var(--t2);flex:0 0 auto}
.preview-card .pv-actions{display:flex;gap:4px;flex:0 0 auto}
.avatar-wrap{position:relative;display:inline-block;line-height:0}
.avatar-inner{position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
.avatar-inner img{width:100%;height:100%;object-fit:cover}
.avatar-frame{position:absolute;left:50%;top:50%;width:120%;height:120%;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.cp-tabs{display:flex;gap:4px;margin-bottom:12px}
.cp-tabs button{flex:1;background:rgba(37,99,235,.08);border:1px solid transparent;border-radius:6px;padding:7px;font-size:12px;cursor:pointer;color:var(--t)}
.cp-tabs button.active{background:var(--p);color:#fff}
.cp-row{margin-bottom:14px}
.cp-row .cp-label{font-size:12px;color:var(--t2);margin-bottom:6px;font-weight:500;display:flex;justify-content:space-between}
.cp-row .cp-label span:last-child{color:var(--t)}
.cp-color-input{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.cp-color-input input[type=color]{width:48px;height:36px;border:none;border-radius:6px;background:transparent;cursor:pointer;padding:0}
.cp-slider{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;outline:none;margin:8px 0;cursor:pointer;touch-action:none}
.cp-slider::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(to right,#cbd5e1,#2563eb);border:none}
.cp-slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--p);cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2);margin-top:-7px}
.cp-slider::-moz-range-track{height:8px;border-radius:4px;background:linear-gradient(to right,#cbd5e1,#2563eb);border:none}
.cp-slider::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--p);cursor:pointer;box-shadow:0 2px 4px rgba(0,0,0,.2)}
.cp-gradient-dir{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.cp-gradient-dir button{background:rgba(37,99,235,.08);border:1px solid transparent;border-radius:5px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--t);min-width:36px}
.cp-gradient-dir button.active{background:var(--p);color:#fff}
.cp-preview{height:64px;border-radius:8px;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);margin-top:8px}
.deco-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:6px}
.deco-pick .deco-item{aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;border:2px solid var(--bd);background:var(--bg);display:flex;align-items:center;justify-content:center;position:relative}
.deco-pick .deco-item.selected{border-color:var(--p);box-shadow:0 0 0 3px rgba(37,99,235,.25)}
.deco-pick .deco-item img{width:100%;height:100%;object-fit:contain}
.select-wrap{display:flex;gap:6px;align-items:center}
.select-wrap select{flex:1}
.select-wrap .btn{flex:0 0 auto;white-space:nowrap}
.size-ctl{display:flex;align-items:center;gap:4px}
.size-ctl button{width:28px;height:28px;border-radius:5px;border:1px solid var(--bd);background:var(--cd);color:var(--t);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.size-ctl button:active{transform:scale(.9);background:rgba(37,99,235,.15)}
.size-ctl .val{min-width:36px;text-align:center;font-size:12px;color:var(--t);font-weight:600}

function C(hex){return {type:'solid', color:hex||'#2563eb', alpha:1};}
function G2(c1,a1,c2,a2,dir){return {type:'linear2', c1:c1||'#2563eb', a1:a1===undefined?1:a1, c2:c2||'#ec4899', a2:a2===undefined?1:a2, dir:dir||135};}
function G3(c1,c2,c3,dir){return {type:'linear3', c1:c1||'#2563eb', c2:c2||'#8b5cf6', c3:c3||'#ec4899', a1:1,a2:1,a3:1, dir:dir||135};}
function hexA(hex,a){
  if(!hex)return 'transparent';
  if(hex==='transparent')return 'transparent';
  if(a===undefined||a===1)return hex;
  let h=hex.replace('#','');
  if(h.length===3)h=h.split('').map(x=>x+x).join('');
  const r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function colorToCss(c){
  if(!c)return 'transparent';
  if(typeof c==='string')return c;
  if(c.type==='solid')return hexA(c.color,c.alpha);
  if(c.type==='linear2')return 'linear-gradient('+(c.dir||135)+'deg, '+hexA(c.c1,c.a1)+', '+hexA(c.c2,c.a2)+')';
  if(c.type==='linear3')return 'linear-gradient('+(c.dir||135)+'deg, '+hexA(c.c1,c.a1)+', '+hexA(c.c2,c.a2)+', '+hexA(c.c3,c.a3)+')';
  return 'transparent';
}
function colorToObj(c){if(!c)return C('#2563eb');if(typeof c==='string')return C(c);return JSON.parse(JSON.stringify(c));}
function colorStyle(c){
  if(!c)return '';
  if(typeof c==='string')return 'color:'+c;
  if(c.type==='solid')return 'color:'+hexA(c.color,c.alpha);
  const css=colorToCss(c);
  return 'background-image:'+css+';background-size:100% 100%;background-repeat:no-repeat;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent';
}
function colorBgStyle(c){
  if(!c)return '';
  const css=colorToCss(c);
  if(css==='transparent')return '';
  if(typeof c==='object' && c.type==='solid'){
    return 'background:'+css+';';
  }
  return 'background-image:'+css+';background-size:100% 100%;background-repeat:no-repeat;';
}
function _pickTextColor(css){
  if(!css||css==='transparent')return '#1e293b';
  let r=255,g=255,b=255;
  if(typeof css==='string'&&css[0]==='#'){
    let h=css.slice(1);
    if(h.length===3)h=h.split('').map(x=>x+x).join('');
    r=parseInt(h.substr(0,2),16);g=parseInt(h.substr(2,2),16);b=parseInt(h.substr(4,2),16);
  } else if(typeof css==='string'&&css.indexOf('rgb')>=0){
    const m=css.match(/rgba?\(([^)]+)\)/);
    if(m){const p=m[1].split(',');r=+p[0];g=+p[1];b=+p[2];}
  } else {
    return '#fff';
  }
  const lum=(0.299*r+0.587*g+0.114*b)/255;
  return lum>0.62?'#1e293b':'#fff';
}

/* ============ 工具 ============ */
function uid(){return Math.random().toString(36).slice(2,9);}
function pad(n){return String(n).padStart(2,'0');}
function fmtDate(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseDate(s){const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function getMonday(d){const r=new Date(d.getFullYear(),d.getMonth(),d.getDate());const day=r.getDay();r.setDate(r.getDate()+(day===0?-6:1-day));return r;}
function shiftShort(name){if(!name)return '—';if(name==='休息'||name==='休班')return '休';return name.length>0?name.slice(0,1):'—';}
function getPerson(id){return state.personnel.find(p=>p.id===id);}
function getMe(){return state.meId?getPerson(state.meId):null;}
function getTable(id){
  if(state.sidebarTable && state.sidebarTable.id===id) return state.sidebarTable;
  return state.tables.find(t=>t.id===id);
}
function getGlobalShift(name){return state.globalShifts.find(s=>s.name===name);}
function getGlobalGroup(name){return state.globalGroups.find(g=>g.name===name);}
function getShiftType(id){return state.shiftTypes.find(s=>s.id===id);}
function getCurrentTable(){
  if(state.currentTableId){
    const t=state.tables.find(x=>x.id===state.currentTableId);
    if(t)return t;
  }
  return state.tables[0];
}
function getDeptForTable(table){
  if(!table||!table.currentDeptId)return null;
  const d=(table.departments||[]).find(x=>x.id===table.currentDeptId);
  if(d)ensureDeptTeams(d,table);
  return d||null;
}
function getCurrentDept(){
  return getDeptForTable(getCurrentTable());
}
function ensureDeptTeams(dept,cur){
  if(!dept||!cur)return;
  if(!dept.teams)dept.teams=[];
  while(dept.teams.length<cur.groups.length){
    dept.teams.push({color:C('#2563eb'),members:[]});
  }
  if(dept.teams.length>cur.groups.length)dept.teams=dept.teams.slice(0,cur.groups.length);
}

function lYearDays(y){let i,s=348;for(i=0x8000;i>0x8;i>>=1)s+=(lunarInfo[y-1900]&i)?1:0;return s+leapDays(y);}
function leapDays(y){if(leapMonth(y))return((lunarInfo[y-1900]&0x10000)?30:29);return 0;}
function leapMonth(y){return lunarInfo[y-1900]&0xf;}
function monthDays(y,m){return(lunarInfo[y-1900]&(0x10000>>m))?30:29;}
function solarToLunar(date){let offset=(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(1900,0,31))/86400000;let i,t=0,ly=1900;for(i=1900;i<2100&&offset>0;i++){t=lYearDays(i);offset-=t;}if(offset<0){offset+=t;i--;}ly=i;let leap=leapMonth(i),isLeap=false;for(i=1;i<13&&offset>0;i++){if(leap>0&&i===(leap+1)&&isLeap===false){--i;isLeap=true;t=leapDays(ly);}else{t=monthDays(ly,i);}if(isLeap===true&&i===(leap+1))isLeap=false;offset-=t;}if(offset===0&&leap>0&&i===leap+1){if(isLeap){isLeap=false;}else{isLeap=true;--i;}}if(offset<0){offset+=t;--i;}return{month:i,day:offset+1,isLeap:isLeap};}

function lunarShort(date){const l=solarToLunar(date);if(l.day===1)return (l.isLeap?'闰':'')+LM[l.month-1]+'月';return LD[l.day-1];}
function lunarFull(date){const l=solarToLunar(date);return (l.isLeap?'闰':'')+LM[l.month-1]+'月'+LD[l.day-1];}

function dynHolidays(y){const d={};let m=new Date(y,4,1);m.setDate(1+((7-m.getDay())%7)+7);d['5-'+m.getDate()]='母亲节';let f=new Date(y,5,1);f.setDate(1+((7-f.getDay())%7)+14);d['6-'+f.getDate()]='父亲节';let t=new Date(y,10,1);t.setDate(1+((4-t.getDay()+7)%7)+21);d['11-'+t.getDate()]='感恩节';return d;}
function getHoliday(date){const key=(date.getMonth()+1)+'-'+date.getDate();if(FIXED_HOLIDAYS[key])return FIXED_HOLIDAYS[key];const dyn=dynHolidays(date.getFullYear());if(dyn[key])return dyn[key];const tm=new Date(date);tm.setDate(tm.getDate()+1);const tl=solarToLunar(tm);if(tl.month===1&&tl.day===1&&!tl.isLeap)return '除夕';const l=solarToLunar(date);const lk=l.month+'-'+l.day;if(!l.isLeap&&LUNAR_HOLIDAYS[lk])return LUNAR_HOLIDAYS[lk];return '';}

    if(v&&!Array.isArray(v)){
      if(v.markId)state.marks[k]=[v.markId];else delete state.marks[k];
    } else if(Array.isArray(v) && v.length>1) {
      state.marks[k]=[v[0]];
    }
  });
  if(!state.tables)state.tables=[];
  if(state.sidebarTable===undefined)state.sidebarTable=null;
  if(state.sidebarTableId===undefined)state.sidebarTableId=null;
  state.tables.forEach(t=>{
    if(!t.departments)t.departments=[];
    if(t.currentDeptId===undefined)t.currentDeptId=null;
    t.departments.forEach(d=>{if(!d.teams)d.teams=[];d.teams.forEach(tm=>{if(!tm.members)tm.members=[];});});
  });
  if(state.sidebarTable){
    if(!state.sidebarTable.departments)state.sidebarTable.departments=[];
    if(state.sidebarTable.currentDeptId===undefined)state.sidebarTable.currentDeptId=null;
    state.sidebarTable.departments.forEach(d=>{if(!d.teams)d.teams=[];d.teams.forEach(tm=>{if(!tm.members)tm.members=[];});});
  }
  applyTheme();
}
function applyTheme(){
  const r=document.documentElement.style;
  function firstColor(c){
    if(!c)return '#2563eb';
    if(typeof c==='string')return c;
    if(c.type==='solid')return c.color;
    return c.c1 || c.color || '#2563eb';
  }
  const primary = firstColor(state.theme.primary);
  r.setProperty('--p', primary);
  r.setProperty('--pd', primary);
  const cb = firstColor(state.theme.calBorder);
  const ccb = firstColor(state.theme.calCellBorder);
  r.setProperty('--cal-border', cb || 'transparent');
  r.setProperty('--cal-cell-border', ccb || 'transparent');
  if(state.theme.dark)document.body.classList.add('dark');
  else document.body.classList.remove('dark');
}

}

function adjustCellSize(page,key,delta){

    cs[key].color=null;

function getShiftStyle(name,page){
  const ps=state.pageSettings[page]||{};
  if(ps.shiftStyles&&ps.shiftStyles[name])return ps.shiftStyles[name];
  const gs=getGlobalShift(name);
  return gs?gs.style:C('#1e293b');
}
function calcPersonShift(person,date){
  if(!person)return null;
  const st=getShiftType(person.shiftTypeId);
  if(!st||!st.cycle||!st.cycle.length)return null;
  const baseDate=person.baseDate?parseDate(person.baseDate):new Date();
  const diff=Math.floor((date-baseDate)/86400000);
  const baseIdx=person.baseIndex!==undefined?person.baseIndex:0;
  const idx=((baseIdx+diff)%st.cycle.length+st.cycle.length)%st.cycle.length;
  const n=st.cycle[idx];
  return {name:typeof n==='string'?n:n.name};
}

function weekNext(){const d=new Date(state.date);d.setDate(d.getDate()+7);state.date=d;state.selectedDate=d;render();}
function goToday(){state.date=new Date();state.selectedDate=new Date();render();}
function monthPrev(){const d=new Date(state.date);d.setMonth(d.getMonth()-1);state.date=d;render();}
function monthNext(){const d=new Date(state.date);d.setMonth(d.getMonth()+1);state.date=d;render();}
function renderMonth(){
  const y=state.date.getFullYear(),m=state.date.getMonth();
  const first=new Date(y,m,1);const days=new Date(y,m+1,0).getDate();
  const startPad=first.getDay()===0?6:first.getDay()-1;
  let cells='';
  const meId=state.meId;const sel=state.selectedDate;const today=new Date();
  const ps=state.pageSettings.home;
  const cs=getCellStyle('home');
  const numSize=cs.num.size+'px', lunarSize=cs.lunar.size+'px';
  const numColor=cs.num.color?colorToCss(cs.num.color):'';
  const lunarColor=cs.lunar.color?colorToCss(cs.lunar.color):'';
  for(let i=0;i<startPad;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const date=new Date(y,m,d);const ds=fmtDate(date);
    const holiday=getHoliday(date);
    const me=meId?getPerson(meId):null;
    const shift=me?calcPersonShift(me,date):null;
    const isSel=sameDay(date,sel);const isToday=sameDay(date,today);
    const marks=getMarksForDate(date);
    let markHtmls='';
    marks.forEach(mid=>{
      const def=state.marks_def.find(x=>x.id===mid);
      if(!def)return;
      if(def.showText)markHtmls+='<div style="font-size:9px;text-align:center;'+(def.fillBg?'background:'+colorToCss(def.bgColor)+';':'')+((isSel||isToday)?'color:#fff;':colorStyle(def.color))+';border-radius:3px;padding:0 2px;margin-top:1px">'+def.name+'</div>';
      else if(def.fillBg)markHtmls+='<div style="height:3px;background:'+colorToCss(def.bgColor)+';border-radius:2px;margin-top:1px"></div>';
    });
    const name=shift?shift.name:'';
    const c=getShiftStyle(name,'home');
    let cls='cal-cell';
    if(isToday)cls+=' today-marked';
    if(isSel)cls+=' sel';
    let style='';
    if(ps.bgColor&&!isSel&&!isToday)style+=colorBgStyle(ps.bgColor)+';';
    const subHtml=holiday?'<span class="cal-sub holiday" style="font-size:'+lunarSize+'">'+holiday+'</span>':'<span class="cal-sub" style="font-size:'+lunarSize+';'+(lunarColor&&!isSel&&!isToday?'color:'+lunarColor:'')+'">'+lunarShort(date)+'</span>';
    const numStyle='font-size:'+numSize+';'+(numColor&&!isSel&&!isToday?'color:'+numColor:'');
    const shiftStyle=(isSel||isToday)?'color:#fff;':(cs.content.color?'color:'+colorToCss(cs.content.color)+';':colorStyle(c));
    cells+='<div class="'+cls+'" data-date="'+ds+'" style="'+style+'"><div class="cal-head"><div class="cal-num" style="'+numStyle+'">'+d+'</div>'+subHtml+'</div>'+(shift?'<div class="cal-shift-mid" style="font-size:'+cs.content.size+'px;'+shiftStyle+'">'+shiftShort(shift.name)+'</div>':'')+markHtmls+'</div>';
  }
  const remain=(7-((startPad+days)%7))%7;
  for(let i=0;i<remain;i++)cells+='<div class="cal-cell empty"></div>';
  return '<div class="month-nav"><button onclick="monthPrev()">‹</button><div class="mn-title">'+y+'年'+(m+1)+'月</div><div style="display:flex;gap:6px;align-items:center"><button class="mn-month" onclick="switchToWeek()">周视图</button><button class="mn-today" onclick="goToday()">今天</button><button class="mn-month" onclick="openHomeSettings()">设置</button><button onclick="monthNext()">›</button></div></div><div class="weekdays">'+WEEK_NAMES.slice(1).concat(WEEK_NAMES[0]).map(w=>'<div>'+w+'</div>').join('')+'</div><div class="cal-grid" id="calGrid">'+cells+'</div><div class="hint-list"><div>💡 长按标记/取消标记</div></div><div class="month-bottom"><div class="day-detail" id="monthDayDetail">'+renderDayDetailTable(sel)+'</div></div>';
}
function attachHomeGestures(){
  const page=document.getElementById('page');
  const strip=document.getElementById('weekStrip');
  if(strip){let sx=0,t0=0;strip.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;t0=Date.now();},{passive:true});strip.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50&&Date.now()-t0<600){if(dx<0)weekNext();else weekPrev();}},{passive:true});}
  const cal=document.getElementById('calGrid');
  if(cal){
    let sx=0,sy=0,t0=0,active=false,lpTimer=null,lpFired=false,lpCell=null;
    cal.addEventListener('touchstart',e=>{
      if(e.touches.length!==1)return;
      sx=e.touches[0].clientX;sy=e.touches[0].clientY;t0=Date.now();active=true;lpFired=false;
      const cell=e.target.closest('.cal-cell');
      if(cell&&cell.dataset.date){lpCell=cell;lpTimer=setTimeout(()=>{lpFired=true;onLongPressDate(cell.dataset.date);},500);}
      else lpCell=null;
    },{passive:true});
    cal.addEventListener('touchmove',e=>{if(!active)return;const dx=Math.abs(e.touches[0].clientX-sx),dy=Math.abs(e.touches[0].clientY-sy);if(dx>12||dy>12){if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}}},{passive:true});
    cal.addEventListener('touchend',e=>{
      if(!active)return;active=false;
      if(lpTimer){clearTimeout(lpTimer);lpTimer=null;}
      const ex=e.changedTouches[0].clientX,ey=e.changedTouches[0].clientY;
      const dx=ex-sx,dy=ey-sy,dt=Date.now()-t0;
      if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4&&dt<600){if(dx<0)monthNext();else monthPrev();lpFired=false;lpCell=null;return;}
      if(dy<-80&&Math.abs(dy)>Math.abs(dx)*1.5&&dt<600){state.view='week';render();return;}
      if(!lpFired&&lpCell&&Math.abs(dx)<12&&Math.abs(dy)<12&&dt<500){state.selectedDate=parseDate(lpCell.dataset.date);render();}
      lpFired=false;lpCell=null;
    },{passive:true});
  }
  if(!page.__pgBound){
    page.__pgBound=true;
    let psy=0,pst=0;
    page.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;psy=e.touches[0].clientY;pst=Date.now();},{passive:true});
    page.addEventListener('touchend',e=>{
      const dy=e.changedTouches[0].clientY-psy;
      const dt=Date.now()-pst;
      if(state.view==='month'&&dy<-80&&dt<600){state.view='week';render();}
      else if(state.view==='week'&&dy>90&&dt<600){state.view='month';render();}
    },{passive:true});
  }
}

function renderCompare(){
  const today=new Date();
  const chips=state.personnel.map(p=>{
    const inner=avatarHtml({avatar:p.avatar,name:p.name,nameColor:p.nameColor||state.theme.primary,frame:p.frame,size:50,fontSize:18});
    return '<div class="person-chip '+(state.cmpSelected.includes(p.id)?'checked':'')+'" onclick="toggleCmp(\''+p.id+'\')">'+inner+'<div class="pc-name" style="'+colorStyle(p.nameColor||state.theme.primary)+'">'+p.name+'</div></div>';
  }).join('');
  if(!state.personnel.length){return '<div class="card"><div class="empty"><div class="em-icon">📊</div>请先添加人员</div></div>';}
  const y=state.date.getFullYear(),m=state.date.getMonth();
  const first=new Date(y,m,1);const days=new Date(y,m+1,0).getDate();
  const startPad=first.getDay()===0?6:first.getDay()-1;
  const cs=state.pageSettings.compare;
  const rules=cs.rules||defaultCompareRules();
  const ruleOpts=rules.map((r,i)=>'<option value="'+i+'" '+(cs.activeRule===i?'selected':'')+'>'+r.name+'</option>').join('');
  const ccs=cs.cellStyle||{num:{size:11,color:null},lunar:{size:9,color:null},content:{size:9,color:null}};
  let cells='';
  for(let i=0;i<startPad;i++)cells+='<div class="cal-cell empty"></div>';
  for(let d=1;d<=days;d++){
    const date=new Date(y,m,d);
    const ruleColor=computeCompareRule(date);
    const isToday=sameDay(date,today);const isSel=sameDay(date,state.selectedDate);
    let cls='cal-cell';
    if(isToday)cls+=' today-marked';
    else if(isSel)cls+=' sel';
    let style='';
    if(cs.bgColor&&!isToday&&!isSel)style+=colorBgStyle(cs.bgColor)+';';
    if(ruleColor&&!isToday&&!isSel)style=colorBgStyle(ruleColor)+';';
    const holiday=getHoliday(date);
    const numColor=ccs.num.color?colorToCss(ccs.num.color):'';
    const lunarColor=ccs.lunar.color?colorToCss(ccs.lunar.color):'';
    let content='<div class="cal-head"><div class="cal-num" style="font-size:'+ccs.num.size+'px;'+(numColor&&!isToday&&!isSel?'color:'+numColor:'')+'">'+d+'</div>'+(holiday?'<span class="cal-sub holiday" style="font-size:'+ccs.lunar.size+'px">'+holiday+'</span>':'<span class="cal-sub" style="font-size:'+ccs.lunar.size+'px;'+(lunarColor&&!isToday&&!isSel?'color:'+lunarColor:'')+'">'+lunarShort(date)+'</span>')+'</div>';
    state.cmpSelected.forEach(pid=>{
      const p=getPerson(pid);if(!p)return;
      const sh=calcPersonShift(p,date);
      const nc=(isToday||isSel)?C('#fff'):(p.nameColor||C('#1e293b'));
      const fs='font-size:'+ccs.content.size+'px;';

      content+='<div class="cal-cmp-name" style="'+colorStyle(nc)+';'+fs+ff+'">'+p.name.slice(0,3)+':'+(sh?shiftShort(sh.name):'—')+'</div>';
    });
    cells+='<div class="'+cls+'" data-date="'+fmtDate(date)+'" style="'+style+'">'+content+'</div>';
  }

  for(let i=0;i<remain;i++)cells+='<div class="cal-cell empty"></div>';

    '<div class="weekdays">'+WEEK_NAMES.slice(1).concat(WEEK_NAMES[0]).map(w=>'<div>'+w+'</div>').join('')+'</div>'+
    '<div class="cal-grid">'+cells+'</div>';
}
function computeCompareRule(date){
  const cs=state.pageSettings.compare;
  const rules=cs.rules||defaultCompareRules();
  if(cs.activeRule===undefined||cs.activeRule===null||!rules[cs.activeRule])return null;
  const r=rules[cs.activeRule];
  let validCount=0;
  state.cmpSelected.forEach(pid=>{if(getPerson(pid))validCount++;});
  if(validCount<2)return null;
  let cnt=0;
  state.cmpSelected.forEach(pid=>{
    const p=getPerson(pid);if(!p)return;
    const sh=calcPersonShift(p,date);
    if(sh&&sh.name===r.shiftName)cnt++;
  });
  if(cnt>=2)return r.color;
  return null;
}

/* ============ 统计页 ============ */
function statCountEnabled(){return state.marks_def.filter(m=>m.countStat);}
function renderStats(){
  const me=getMe();
  if(!me)return '<div class="card"><div class="empty"><div class="em-icon">📊</div>请先添加人员</div></div>';
  const y=new Date().getFullYear();
  const m=new Date().getMonth()+1;
  const statMarks=statCountEnabled();
  function calcMonth(mm){
    const dm=new Date(y,mm,0).getDate();
    let should=0;
    const markCounts={};
    statMarks.forEach(mk=>markCounts[mk.id]=0);
    for(let d=1;d<=dm;d++){
      const date=new Date(y,mm-1,d);
      const shift=calcPersonShift(me,date);
      const isRest=!shift||shift.name==='休息'||shift.name==='休班';
      if(!isRest)should++;
      const marks=getMarksForDate(date);
      marks.forEach(mid=>{if(markCounts[mid]!==undefined)markCounts[mid]++;});
    }
    return {should,markCounts};
  }
  const cur=calcMonth(m);
  let yearShould=0;const yearMarkCounts={};
  statMarks.forEach(mk=>yearMarkCounts[mk.id]=0);
  const months=[];
  for(let mm=1;mm<=12;mm++){
    const r=calcMonth(mm);months.push(r);yearShould+=r.should;
    statMarks.forEach(mk=>yearMarkCounts[mk.id]+=r.markCounts[mk.id]);
  }
  function actualOf(r){
    let a=r.should;
    statMarks.forEach(mk=>{
      if(mk.id==='overtime')a+=r.markCounts[mk.id];
      else a-=r.markCounts[mk.id];
    });
    return Math.max(0,a);
  }
  const curActual=actualOf(cur);
  const yearActual=(()=>{let a=yearShould;statMarks.forEach(mk=>{if(mk.id==='overtime')a+=yearMarkCounts[mk.id];else a-=yearMarkCounts[mk.id];});return Math.max(0,a);})();
  let curMarkCards='';
  statMarks.forEach(mk=>{
    curMarkCards+='<div><div class="sv" style="color:'+colorToCss(mk.bgColor)+'">'+cur.markCounts[mk.id]+'</div><div class="sl">'+mk.name+'</div></div>';
  });
  let yearMarkCards='';
  statMarks.forEach(mk=>{
    yearMarkCards+='<div><div class="sv" style="color:'+colorToCss(mk.bgColor)+'">'+yearMarkCounts[mk.id]+'</div><div class="sl">'+mk.name+'</div></div>';
  });
  let html='';
  html+='<div class="stat-cards">'+
    '<div class="stat-card"><div class="sv">'+curActual+'</div><div class="sl">本月实际上班(天)</div></div>'+
    '<div class="stat-card"><div class="stat-multi">'+(curMarkCards||'<div><div class="sv">0</div><div class="sl">无</div></div>')+'</div></div>'+
    '<div class="stat-card green"><div class="sv">'+yearActual+'</div><div class="sl">年度实际上班(天)</div></div>'+
    '<div class="stat-card"><div class="stat-multi">'+(yearMarkCards||'<div><div class="sv">0</div><div class="sl">无</div></div>')+'</div></div>'+
  '</div>';
  const cols=statMarks.map(mk=>mk.name);
  html+='<div class="card"><div class="card-title">'+me.name+' · '+y+'年 月度明细</div><table style="width:100%;font-size:12px;border-collapse:collapse"><thead><tr style="background:rgba(37,99,235,.05);color:var(--t2)"><th style="padding:6px;text-align:left">月份</th><th style="padding:6px;text-align:center">应上班</th>'+cols.map(c=>'<th style="padding:6px;text-align:center">'+c+'</th>').join('')+'<th style="padding:6px;text-align:center">实际上班</th></tr></thead><tbody>';
  months.forEach((r,i)=>{
    const act=actualOf(r);
    html+='<tr style="border-top:1px solid var(--bd)"><td style="padding:6px">'+(i+1)+'月</td><td style="padding:6px;text-align:center;color:var(--p);font-weight:600">'+r.should+'</td>'+statMarks.map(mk=>'<td style="padding:6px;text-align:center;color:var(--r);font-weight:600">'+r.markCounts[mk.id]+'</td>').join('')+'<td style="padding:6px;text-align:center;color:var(--g);font-weight:600">'+act+'</td></tr>';
  });
  html+='<tr style="border-top:2px solid var(--p);background:rgba(37,99,235,.08)"><td style="padding:8px;font-weight:700">小计</td><td style="padding:8px;text-align:center;font-weight:700;color:var(--p)">'+yearShould+'</td>'+statMarks.map(mk=>'<td style="padding:8px;text-align:center;font-weight:700;color:var(--r)">'+yearMarkCounts[mk.id]+'</td>').join('')+'<td style="padding:8px;text-align:center;font-weight:700;color:var(--g)">'+yearActual+'</td></tr>';
  html+='</tbody></table></div>';
  return html;
}

function attachSidebarGestures(){
  const cal=document.getElementById('overviewGrid');
  if(!cal)return;
  let sx=0,sy=0,t0=0,active=false;
  cal.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;t0=Date.now();active=true;},{passive:true});
  cal.addEventListener('touchend',e=>{
    if(!active)return;active=false;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,dt=Date.now()-t0;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4&&dt<600){if(dx<0)monthNext();else monthPrev();return;}
    if(Math.abs(dx)<12&&Math.abs(dy)<12&&dt<500){
      const cell=e.target.closest('.team-cal-cell');
      if(cell&&cell.dataset.date){state.selectedDate=parseDate(cell.dataset.date);render();}
    }
  },{passive:true});
}

function attachOverviewGestures(){
  const cal=document.getElementById('overviewGrid');
  if(!cal)return;
  let sx=0,sy=0,t0=0,active=false;
  cal.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;t0=Date.now();active=true;},{passive:true});
  cal.addEventListener('touchend',e=>{
    if(!active)return;active=false;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy,dt=Date.now()-t0;
    if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4&&dt<600){if(dx<0)monthNext();else monthPrev();return;}
    if(Math.abs(dx)<12&&Math.abs(dy)<12&&dt<500){
      const cell=e.target.closest('.team-cal-cell');
      if(cell&&cell.dataset.date){state.selectedDate=parseDate(cell.dataset.date);render();}
    }
  },{passive:true});
}
function calcTableDay(table,date){
  if(!table)return [];
  const baseDate=parseDate(table.baseDate);
  const diff=Math.floor((date-baseDate)/86400000);
  const dept=getDeptForTable(table);
  const result={};
  table.groups.forEach((g,i)=>{
    const team=dept&&dept.teams[i]?dept.teams[i]:null;
    const baseIdx=table.baseIndex[g]!==undefined?table.baseIndex[g]:0;
    const idx=((baseIdx+diff)%table.cycleDays+table.cycleDays)%table.cycleDays;
    const name=table.cycle[idx];
    if(!result[name])result[name]=[];
    result[name].push({
      name:g,
      members:team?(team.members||[]):[],
      color:team?team.color:null
    });
  });
  const ordered=[];
  (table.shiftList||[]).forEach(sn=>{if(result[sn])ordered.push({shift:sn,groups:result[sn]});});
  Object.keys(result).forEach(sn=>{if(!ordered.find(o=>o.shift===sn))ordered.push({shift:sn,groups:result[sn]});});
  return ordered;
}

function ovEditorHtml(){
  const f=window.__ovForm;if(!f)return '';
  f.groups.forEach(g=>{if(f.baseIndex[g]===undefined)f.baseIndex[g]=0;});
  while(f.cycle.length<f.cycleDays)f.cycle.push(f.shiftList[0]||'');
  f.cycle=f.cycle.slice(0,f.cycleDays);
  if(!f.cycle.every(c=>f.shiftList.indexOf(c)>=0))f.cycle=f.cycle.map(c=>f.shiftList.indexOf(c)>=0?c:f.shiftList[0]);
  let groupRows='';
  f.groups.forEach((g,i)=>{groupRows+='<div class="preview-card"><div class="pv-label">'+g+'</div><div class="pv-actions" onclick="event.stopPropagation()"><button class="icon-btn red" onclick="ovDelGroup('+i+')">×</button></div></div>';});
  let shiftRows='';
  f.shiftList.forEach((sh,i)=>{const gs=getGlobalShift(sh);const style=gs?.style||C('#1e293b');shiftRows+='<div class="preview-card"><div class="pv-label">'+sh+'</div><div class="pv-value" style="'+colorBgStyle(style)+'">'+sh+'</div><div class="pv-actions" onclick="event.stopPropagation()"><button class="icon-btn red" onclick="ovDelShift('+i+')">×</button></div></div>';});
  let cycleRows='';
  for(let i=0;i<f.cycleDays;i++){
    const v=f.cycle[i]||f.shiftList[0]||'';
    cycleRows+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="font-size:11px;color:var(--t2);width:44px">第'+(i+1)+'天</span><select class="inp" onchange="ovSetCycle('+i+',this.value)" style="flex:1;padding:6px">'+f.shiftList.map(sh=>'<option value="'+sh+'" '+(sh===v?'selected':'')+'>'+sh+'</option>').join('')+'</select></div>';
  }
  let baseRows='';
  const baseDateStr = f.baseDate || TODAY_STR;
  const baseDateObj = parseDate(baseDateStr);
  const diffDays = Math.floor((new Date() - baseDateObj) / 86400000);
  f.groups.forEach(g=>{
    const baseIdx = f.baseIndex[g]||0;
    const todayIdx = ((baseIdx + diffDays) % f.cycleDays + f.cycleDays) % f.cycleDays;
    let opts='';
    for(let i=0;i<f.cycleDays;i++)opts+='<option value="'+i+'" '+(i===todayIdx?'selected':'')+'>第'+(i+1)+'天（'+f.cycle[i]+'）</option>';

  });
  return '<div class="modal-head"><h3>'+(window.__ovEditId?'编辑':'新建')+'排班表</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">'+
    '<div class="field"><label>排班表名称</label><input class="inp" value="'+f.name+'" oninput="window.__ovForm.name=this.value"></div>'+
    '<div class="setting-group"><div class="setting-label">班组槽位（对应部门内班组位置）</div>'+groupRows+'<button class="btn sm ghost block" onclick="ovAddGroup()">+ 添加槽位</button></div>'+
    '<div class="setting-group"><div class="setting-label">班次列表</div>'+shiftRows+'<button class="btn sm ghost block" onclick="ovAddShift()">+ 添加班次</button></div>'+
    '<div class="field"><label>轮班天数</label><select class="inp" onchange="ovSetCycleDays(+this.value)">'+[2,3,4,5,6,7,8,9,10,12,14,15,16,18,20,21,24,28,30].map(n=>'<option value="'+n+'" '+(n===f.cycleDays?'selected':'')+'>'+n+'天</option>').join('')+'</select></div>'+
    '<div class="setting-group"><div class="setting-label">轮班顺序</div>'+cycleRows+'</div>'+
    '<div class="setting-group"><div class="setting-label">今天各组在第几天</div>'+baseRows+'</div>'+
  '</div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="confirmOvTable()">保存</button></div>';
}

function ovSetBaseIndex(g,v){

  const baseIdx = ((v - diffDays) % f.cycleDays + f.cycleDays) % f.cycleDays;

  openColorPicker(name+' 样式',curStyle,function(c){
    ps.shiftStyles[name]=c;save();render();refreshOverviewSettings();
  });
}
function resetOverviewShiftStyle(name){
  const isSidebar=state.page==='sidebar';
  const ps=isSidebar?state.pageSettings.sidebar:state.pageSettings.overview;
  delete ps.shiftStyles[name];
  save();render();refreshOverviewSettings();
}
function ovToggleCalShift(name,checked){
  const isSidebar=state.page==='sidebar';
  const ps=isSidebar?state.pageSettings.sidebar:state.pageSettings.overview;
  const cur=isSidebar?state.sidebarTable:getCurrentTable();
  if(!cur)return;
  if(ps.calShifts===null||ps.calShifts===undefined)ps.calShifts=cur.shiftList.slice();
  const i=ps.calShifts.indexOf(name);
  if(checked){if(i<0)ps.calShifts.push(name);}else{if(i>=0)ps.calShifts.splice(i,1);}
  if(cur.shiftList.every(s=>ps.calShifts.indexOf(s)>=0))ps.calShifts=null;
  save();render();refreshOverviewSettings();
}
function ovToggleCardShift(name,checked){
  const isSidebar=state.page==='sidebar';
  const ps=isSidebar?state.pageSettings.sidebar:state.pageSettings.overview;
  const cur=isSidebar?state.sidebarTable:getCurrentTable();
  if(!cur)return;
  if(ps.cardShifts===null||ps.cardShifts===undefined)ps.cardShifts=cur.shiftList.slice();
  const i=ps.cardShifts.indexOf(name);
  if(checked){if(i<0)ps.cardShifts.push(name);}else{if(i>=0)ps.cardShifts.splice(i,1);}
  if(cur.shiftList.every(s=>ps.cardShifts.indexOf(s)>=0))ps.cardShifts=null;
  save();render();refreshOverviewSettings();
}
function ovMoveCalShift(i,delta){
  const isSidebar=state.page==='sidebar';

  const cur=isSidebar?state.sidebarTable:getCurrentTable();

  const t=ps.calShiftOrder[i];ps.calShiftOrder[i]=ps.calShiftOrder[j];ps.calShiftOrder[j]=t;

}
function ovMoveCardShift(i,delta){

  save();render();refreshOverviewSettings();

/* ============ 部门管理（普通排班表）============ */
function deptManagerHtml(){
  const cur=getCurrentTable();
  if(!cur)return '<div class="modal-head"><h3>部门管理</h3></div>';
  if(!cur.departments)cur.departments=[];
  let html='<div class="modal-head"><h3>部门管理</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">';
  html+='<div style="font-size:12px;color:var(--t2);margin-bottom:8px">排班表：'+cur.name+'</div>';
  html+='<div class="setting-group">';
  if(!cur.departments.length)html+='<div class="empty" style="padding:12px">还没有部门</div>';
  else{
    cur.departments.forEach(d=>{
      ensureDeptTeams(d,cur);
      const isCur=cur.currentDeptId===d.id;
      html+='<div class="preview-card '+(isCur?'selected':'')+'" onclick="pickDept(\''+d.id+'\')"><div class="pv-label">'+d.name+'</div><div class="pv-time">'+cur.groups.length+'个班组</div><div class="pv-actions" onclick="event.stopPropagation()"><button class="icon-btn" onclick="openDeptEdit(\''+d.id+'\')">✏️</button><button class="icon-btn red" onclick="deleteDept(\''+d.id+'\')">×</button></div></div>';
    });
  }
  html+='<button class="btn sm ghost block" onclick="addDept()">+ 新建部门</button>';
  html+='<button class="btn sm ghost block" style="margin-top:6px;color:var(--r)" onclick="clearDept()">清空部门选择</button>';
  html+='</div></div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">关闭</button></div>';
  return html;
}
function openDeptManager(){updateTopLayer(deptManagerHtml());}
function refreshDeptManager(){updateTopLayer(deptManagerHtml());}
function addDept(){
  const cur=getCurrentTable();
  promptInput('部门名称','',function(v){
    v=(v||'').trim();if(!v)return;
    if(!cur.departments)cur.departments=[];
    const d={id:uid(),name:v,teams:[]};
    ensureDeptTeams(d,cur);
    cur.departments.push(d);
    if(!cur.currentDeptId) cur.currentDeptId = d.id;
    save();refreshDeptManager();
  });
}
function pickDept(id){const cur=getCurrentTable();cur.currentDeptId=id;save();closeModal();render();}
function clearDept(){const cur=getCurrentTable();cur.currentDeptId=null;save();closeModal();render();}
function deleteDept(id){
  customConfirm('删除部门', '确定删除该部门？', function(){
    const cur=getCurrentTable();
    cur.departments=cur.departments.filter(d=>d.id!==id);
    if(cur.currentDeptId===id)cur.currentDeptId=null;
    save();render();refreshDeptManager();
  });
}
function deptEditHtml(deptId){
  const cur=getCurrentTable();
  const d=(cur.departments||[]).find(x=>x.id===deptId);if(!d)return '';
  ensureDeptTeams(d,cur);
  let html='<div class="modal-head"><h3>编辑部门 · '+d.name+'</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">';
  html+='<div class="field"><label>部门名称</label><input class="inp" value="'+d.name+'" oninput="editDeptName(\''+deptId+'\',this.value)"></div>';
  html+='<div class="setting-group"><div class="setting-label">班组列表（跟随当前排班表）</div>';
  if(!cur.groups.length){
    html+='<div class="empty" style="padding:8px;font-size:12px">排班表还没有班组</div>';
  } else {
    cur.groups.forEach((g,ti)=>{
      const t=d.teams[ti]||{color:C('#2563eb'),members:[]};
      html+='<div class="preview-card" onclick="openDeptTeamEdit(\''+deptId+'\','+ti+')"><div class="pv-label">'+g+'</div><div class="pv-value" style="'+colorBgStyle(t.color)+'">'+g+'</div><div class="pv-time">'+(t.members||[]).length+'人</div></div>';
    });
  }
  html+='</div></div><div class="modal-foot"><button class="btn ghost" onclick="openDeptManager()">返回</button><button class="btn" onclick="save();showToast(\'已保存\');openDeptManager()">保存</button></div>';
  return html;
}
function openDeptEdit(deptId){
  const cur=getCurrentTable();
  if(!cur)return;
  if(cur.currentDeptId !== deptId){
    cur.currentDeptId = deptId;
    save();
    render();
  }
  updateTopLayer(deptEditHtml(deptId));
}
function refreshDeptEdit(deptId){updateTopLayer(deptEditHtml(deptId));}
function editDeptName(id,v){
  const cur=getCurrentTable();
  const d=(cur.departments||[]).find(x=>x.id===id);if(d){d.name=v;save();}
}
function deptTeamEditHtml(deptId,ti){
  const cur=getCurrentTable();
  const d=(cur.departments||[]).find(x=>x.id===deptId);if(!d)return '';
  ensureDeptTeams(d,cur);
  const teamName=cur.groups[ti]||('班组'+(ti+1));
  const t=d.teams[ti]||{color:C('#2563eb'),members:[]};
  if(!t.members)t.members=[];
  let memberHtml='';
  if(!t.members.length)memberHtml='<div class="empty" style="padding:8px;font-size:12px">还没有成员</div>';
  else{
    t.members.forEach((m,mi)=>{
      memberHtml+='<div style="display:flex;align-items:center;gap:8px;padding:8px;background:rgba(37,99,235,.05);border-radius:6px;margin-bottom:6px"><span style="flex:1;font-size:13px">'+m+'</span><button class="icon-btn red" onclick="removeDeptTeamMember(\''+deptId+'\','+ti+','+mi+')">×</button></div>';
    });
  }
  return '<div class="modal-head"><h3>编辑班组 · '+teamName+'</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">'+
    '<div style="font-size:12px;color:var(--t2);margin-bottom:8px">班组名跟随排班表：'+teamName+'</div>'+
    '<div class="setting-label">颜色</div><div class="preview-card" onclick="pickDeptTeamColor(\''+deptId+'\','+ti+')"><div class="pv-value" style="'+colorBgStyle(t.color)+'">'+teamName+'</div></div>'+
    '<div class="setting-label" style="margin-top:8px">成员（自定义输入）</div>'+memberHtml+
    '<div style="display:flex;gap:6px;margin-top:8px"><input class="inp" id="deptMemberInput" placeholder="输入成员姓名" style="flex:1"><button class="btn sm" onclick="addDeptTeamMember(\''+deptId+'\','+ti+')">添加</button></div>'+
  '</div><div class="modal-foot"><button class="btn ghost" onclick="refreshDeptEdit(\''+deptId+'\')">返回</button></div>';
}
function openDeptTeamEdit(deptId,ti){updateTopLayer(deptTeamEditHtml(deptId,ti));}
function addDeptTeamMember(deptId,ti){
  const cur=getCurrentTable();
  const d=(cur.departments||[]).find(x=>x.id===deptId);if(!d)return;
  ensureDeptTeams(d,cur);
  const t=d.teams[ti];if(!t)return;
  const el=document.getElementById('deptMemberInput');
  const v=(el?el.value:'').trim();
  if(!v){showToast('请输入成员姓名');return;}
  if(!t.members)t.members=[];
  t.members.push(v);
  save();render();updateTopLayer(deptTeamEditHtml(deptId,ti));
}
function removeDeptTeamMember(deptId,ti,mi){
  const cur=getCurrentTable();
  const d=(cur.departments||[]).find(x=>x.id===deptId);if(!d)return;
  const t=d.teams[ti];if(!t||!t.members)return;
  t.members.splice(mi,1);
  save();render();updateTopLayer(deptTeamEditHtml(deptId,ti));
}
function pickDeptTeamColor(deptId,ti){
  const cur=getCurrentTable();
  const d=(cur.departments||[]).find(x=>x.id===deptId);if(!d)return;
  ensureDeptTeams(d,cur);
  const t=d.teams[ti];if(!t)return;
  const teamName=cur.groups[ti]||'班组';
  openColorPicker(teamName+' 颜色',t.color,function(c){
    t.color=c;save();render();
    updateTopLayer(deptTeamEditHtml(deptId,ti));
  });
}

/* ============ 班组管理（全局）============ */
function openGroupManager(){
  let html='<div class="modal-head"><h3>班组管理</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">';
  html+='<div class="setting-group">';
  state.globalGroups.forEach(g=>{
    html+='<div class="preview-card"><div class="pv-label">'+g.name+'</div><div class="pv-value" style="'+colorBgStyle(g.style)+'">'+g.name+'</div><div class="pv-actions"><button class="icon-btn" onclick="editGlobalGroup(\''+g.id+'\')">✏️</button><button class="icon-btn red" onclick="deleteGlobalGroup(\''+g.id+'\')">×</button></div></div>';
  });
  html+='<button class="btn sm ghost block" onclick="addGlobalGroup()">+ 新建班组</button>';
  html+='</div></div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">关闭</button></div>';
  pushModal(html);
}
function addGlobalGroup(){
  promptInput('班组名称','',function(v){
    v=(v||'').trim();if(!v)return;
    if(getGlobalGroup(v)){showToast('已存在');return;}
    state.globalGroups.push({id:uid(),name:v,style:C('#2563eb')});
    save();render();
  });
}
function editGlobalGroup(id, isRefresh){
  const g=state.globalGroups.find(x=>x.id===id);if(!g)return;
  window.__editingGroupId = id;
  const html='<div class="modal-head"><h3>编辑班组</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">'+
    '<div class="field"><label>班组名称</label><input class="inp" value="'+g.name+'" oninput="editGroupName(\''+id+'\',this.value)"></div>'+
    '<div class="setting-label">颜色</div><div class="preview-card" onclick="pickGroupColor(\''+id+'\')"><div class="pv-value" style="'+colorBgStyle(g.style)+'">'+g.name+'</div></div>'+
    '</div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">返回</button></div>';
  if(isRefresh) updateTopLayer(html);
  else pushModal(html,true);
}
function editGroupName(id,v){
  const g=state.globalGroups.find(x=>x.id===id);if(!g)return;
  const oldName=g.name;g.name=v;
  if(v!==oldName)state.personnel.forEach(p=>{if(p.team===oldName)p.team=v;});
  save();
}
function pickGroupColor(id){
  const g=state.globalGroups.find(x=>x.id===id);if(!g)return;
  openColorPicker('班组颜色',g.style,function(c){
    g.style=c;save();render();
    if(window.__editingGroupId===id)editGlobalGroup(id,true);
  });
}
function deleteGlobalGroup(id){
  if(state.globalGroups.length<=1){showToast('至少保留一个班组');return;}
  customConfirm('删除班组', '确定删除该班组？', function(){
    state.globalGroups=state.globalGroups.filter(x=>x.id!==id);
    save();render();
  });
}

/* ============ 排班管理 ============ */
function renderScheduleManage(){
  const list=state.shiftTypes.map(st=>{
    const cycleStr=(st.cycle||[]).map(c=>typeof c==='string'?c:c.name).join('→');
    return '<div class="shift-item"><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600;color:var(--t)">'+st.name+(st.isPreset?' <span class="badge" style="background:rgba(37,99,235,.1);color:var(--p)">预置</span>':'')+'</div><div style="font-size:11px;color:var(--t2);margin-top:2px">'+(st.hoursPerShift||8)+'小时制 · '+(st.cycle?st.cycle.length:0)+'天一轮 · '+cycleStr+'</div></div><button class="icon-btn" onclick="openEditShiftTypeModal(\''+st.id+'\')">✏️</button>'+(st.isPreset?'':'<button class="icon-btn red" onclick="deleteShiftType(\''+st.id+'\')">🗑️</button>')+'</div>';
  }).join('');
  const shiftList=state.globalShifts.map(sh=>{
    const t=sh.time||{start:'',end:''};
    const timeStr=(t.start||t.end)?('<div class="pv-time">'+t.start+'~'+t.end+'</div>'):'';
    return '<div class="preview-card" style="flex-shrink:0;min-width:110px" onclick="editGlobalShift(\''+sh.id+'\')"><div class="pv-label">'+sh.name+'</div><div class="pv-value" style="'+colorBgStyle(sh.style)+'">'+sh.name+'</div>'+timeStr+'<div class="pv-actions" onclick="event.stopPropagation()"><button class="icon-btn red" onclick="deleteGlobalShift(\''+sh.id+'\')">×</button></div></div>';
  }).join('');
  const groupList=state.globalGroups.map(g=>{
    return '<div class="preview-card" style="flex-shrink:0;min-width:90px" onclick="editGlobalGroup(\''+g.id+'\')"><div class="pv-label">'+g.name+'</div><div class="pv-value" style="'+colorBgStyle(g.style)+'">'+g.name+'</div><div class="pv-actions" onclick="event.stopPropagation()"><button class="icon-btn red" onclick="deleteGlobalGroup(\''+g.id+'\')">×</button></div></div>';
  }).join('');
  return '<div class="card"><div class="card-title"><span>班种（轮班规则）</span><button class="btn sm" onclick="openNewShiftTypeModal()">+ 新建</button></div>'+list+'</div>'+
    '<div class="card"><div class="card-title"><span>班次管理</span><button class="btn sm" onclick="addGlobalShift()">+ 新建</button></div><div class="person-scroll">'+(shiftList||'<div class="empty" style="padding:10px">暂无班次</div>')+'</div></div>'+
    '<div class="card"><div class="card-title"><span>班组管理</span><button class="btn sm" onclick="addGlobalGroup()">+ 新建</button></div><div class="person-scroll">'+(groupList||'<div class="empty" style="padding:10px">暂无班组</div>')+'</div></div>';
}
function stEditorHtml(){
  const f=window.__stForm;if(!f)return '';
  f.groups.forEach(g=>{if(f.baseIndex[g]===undefined)f.baseIndex[g]=0;});
  while(f.cycle.length<f.cycleDays)f.cycle.push(f.shiftList[0]||'');
  f.cycle=f.cycle.slice(0,f.cycleDays);
  if(!f.cycle.every(c=>f.shiftList.indexOf(c)>=0))f.cycle=f.cycle.map(c=>f.shiftList.indexOf(c)>=0?c:f.shiftList[0]);
  let groupRows='';f.groups.forEach((g,i)=>{groupRows+='<div class="preview-card"><div class="pv-label">'+g+'</div><div class="pv-actions" onclick="event.stopPropagation()"><button class="icon-btn red" onclick="stDelGroup('+i+')">×</button></div></div>';});
  let shiftRows='';f.shiftList.forEach((sh,i)=>{shiftRows+='<div class="preview-card"><div class="pv-label">'+sh+'</div><div class="pv-actions" onclick="event.stopPropagation()"><button class="icon-btn red" onclick="stDelShift('+i+')">×</button></div></div>';});
  let cycleRows='';
  for(let i=0;i<f.cycleDays;i++){
    const v=f.cycle[i]||f.shiftList[0]||'';
    cycleRows+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="font-size:11px;color:var(--t2);width:44px">第'+(i+1)+'天</span><select class="inp" onchange="stSetCycle('+i+',this.value)" style="flex:1;padding:6px">'+f.shiftList.map(sh=>'<option value="'+sh+'" '+(sh===v?'selected':'')+'>'+sh+'</option>').join('')+'</select></div>';
  }
  let baseRows='';
  f.groups.forEach(g=>{
    const v=f.baseIndex[g]||0;let opts='';
    for(let i=0;i<f.cycleDays;i++)opts+='<option value="'+i+'" '+(i===v?'selected':'')+'>第'+(i+1)+'天（'+f.cycle[i]+'）</option>';
    baseRows+='<div style="display:flex;align-items:center;gap:6px;margin-bottom:6px"><span style="font-size:12px;font-weight:600;width:44px">'+g+'</span><select class="inp" onchange="stSetBaseIndex(\''+g+'\',+this.value)" style="flex:1;padding:6px">'+opts+'</select></div>';
  });
  return '<div class="modal-head"><h3>'+(window.__stEditId?'编辑':'新建')+'班种</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">'+
    '<div class="row"><div class="field" style="flex:2"><label>班种名称</label><input class="inp" value="'+f.name+'" oninput="window.__stForm.name=this.value"></div><div class="field" style="flex:1"><label>小时制</label><input class="inp" type="number" value="'+f.hours+'" oninput="window.__stForm.hours=+this.value"></div></div>'+
    '<div class="setting-group"><div class="setting-label">班组列表</div>'+groupRows+'<button class="btn sm ghost block" onclick="stAddGroup()">+ 添加班组</button></div>'+
    '<div class="setting-group"><div class="setting-label">班次列表</div>'+shiftRows+'<button class="btn sm ghost block" onclick="stAddShift()">+ 添加班次</button></div>'+
    '<div class="field"><label>轮班天数</label><select class="inp" onchange="stSetCycleDays(+this.value)">'+[2,3,4,5,6,7,8,9,10,12,14,15,16,18,20,21,24,28,30].map(n=>'<option value="'+n+'" '+(n===f.cycleDays?'selected':'')+'>'+n+'天</option>').join('')+'</select></div>'+
    '<div class="setting-group"><div class="setting-label">轮班顺序</div>'+cycleRows+'</div>'+
    '<div class="setting-group"><div class="setting-label">今天各组在第几天</div>'+baseRows+'</div>'+
  '</div><div class="modal-foot"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="confirmStType()">保存</button></div>';
}
function openNewShiftTypeModal(){
  window.__stEditId=null;
  window.__stForm={name:'',hours:8,groups:state.globalGroups.map(g=>g.name).slice(0,4),shiftList:state.globalShifts.map(s=>s.name).slice(0,4),cycleDays:8,cycle:[],baseIndex:{}};
  if(!window.__stForm.groups.length)window.__stForm.groups=['甲','乙','丙','丁'];
  if(!window.__stForm.shiftList.length)window.__stForm.shiftList=['白班','夜班','二班','休息'];
  for(let i=0;i<window.__stForm.cycleDays;i++)window.__stForm.cycle.push(window.__stForm.shiftList[0]||'');
  window.__stForm.groups.forEach(g=>{window.__stForm.baseIndex[g]=0;});
  updateTopLayer(stEditorHtml());
}
function openEditShiftTypeModal(id){
  window.__stEditId=id;
  const st=getShiftType(id);
  window.__stForm={name:st.name,hours:st.hoursPerShift||8,groups:(st.groups||[]).slice(),shiftList:[...new Set((st.cycle||[]).map(c=>typeof c==='string'?c:c.name))],cycleDays:(st.cycle||[]).length,cycle:(st.cycle||[]).map(c=>typeof c==='string'?c:c.name),baseIndex:st.baseIndex?JSON.parse(JSON.stringify(st.baseIndex)):{}};
  if(!window.__stForm.groups.length)window.__stForm.groups=['甲','乙','丙','丁'];
  if(!window.__stForm.shiftList.length)window.__stForm.shiftList=['白班','夜班','二班','休息'];
  window.__stForm.groups.forEach(g=>{if(window.__stForm.baseIndex[g]===undefined)window.__stForm.baseIndex[g]=0;});
  updateTopLayer(stEditorHtml());
}
function stAddGroup(){
  promptInput('班组名称','',function(v){
    v=(v||'').trim();if(!v)return;
    if(!getGlobalGroup(v))state.globalGroups.push({id:uid(),name:v,style:C('#2563eb')});
    if(window.__stForm.groups.indexOf(v)<0)window.__stForm.groups.push(v);
    window.__stForm.baseIndex[v]=0;
    save();updateTopLayer(stEditorHtml());
  });
}
function stDelGroup(i){
  if(window.__stForm.groups.length<=1){showToast('至少保留一个');return;}
  const g=window.__stForm.groups[i];window.__stForm.groups.splice(i,1);delete window.__stForm.baseIndex[g];
  updateTopLayer(stEditorHtml());
}
function stAddShift(){
  promptInput('班次名称','',function(v){
    v=(v||'').trim();if(!v)return;
    if(!getGlobalShift(v))state.globalShifts.push({id:uid(),name:v,style:C('#1e293b'),time:{start:'',end:''}});
    if(window.__stForm.shiftList.indexOf(v)<0)window.__stForm.shiftList.push(v);
    save();updateTopLayer(stEditorHtml());
  });
}
function stDelShift(i){
  if(window.__stForm.shiftList.length<=1){showToast('至少保留一个班次');return;}
  const s=window.__stForm.shiftList[i];window.__stForm.shiftList.splice(i,1);
  window.__stForm.cycle=window.__stForm.cycle.map(c=>c===s?window.__stForm.shiftList[0]:c);
  updateTopLayer(stEditorHtml());
}

function replaceShiftKey(map, oldName, newName){
  if(!map||map[oldName]===undefined)return;
  map[newName]=map[oldName];
  delete map[oldName];
}
function editShiftName(id,v){
  const sh=state.globalShifts.find(x=>x.id===id);if(!sh)return;
  const oldName=sh.name;
  if(v===oldName)return;
  sh.name=v;
  state.shiftTypes.forEach(st=>{st.cycle=(st.cycle||[]).map(c=>typeof c==='string'?(c===oldName?v:c):(c.name===oldName?Object.assign({},c,{name:v}):c));});
  state.tables.forEach(t=>{
    t.shiftList=(t.shiftList||[]).map(n=>n===oldName?v:n);
    t.cycle=(t.cycle||[]).map(n=>n===oldName?v:n);
  });
  if(state.sidebarTable){
    state.sidebarTable.shiftList=(state.sidebarTable.shiftList||[]).map(n=>n===oldName?v:n);
    state.sidebarTable.cycle=(state.sidebarTable.cycle||[]).map(n=>n===oldName?v:n);
  }
  const rules=state.pageSettings.compare&&state.pageSettings.compare.rules;
  if(rules)rules.forEach(r=>{if(r.shiftName===oldName)r.shiftName=v;});
  ['home','overview','sidebar'].forEach(k=>{
    const ps=state.pageSettings[k];
    if(ps&&ps.shiftStyles)replaceShiftKey(ps.shiftStyles,oldName,v);
  });
  ['overview','sidebar'].forEach(k=>{
    const ps=state.pageSettings[k];
    if(!ps)return;
    if(Array.isArray(ps.calShifts))ps.calShifts=ps.calShifts.map(n=>n===oldName?v:n);
    if(Array.isArray(ps.calShiftOrder))ps.calShiftOrder=ps.calShiftOrder.map(n=>n===oldName?v:n);
    if(Array.isArray(ps.cardShifts))ps.cardShifts=ps.cardShifts.map(n=>n===oldName?v:n);
    if(Array.isArray(ps.cardShiftOrder))ps.cardShiftOrder=ps.cardShiftOrder.map(n=>n===oldName?v:n);
  });
  const ex=state.pageSettings.export;
  if(ex){
    replaceShiftKey(ex.home&&ex.home.shiftColors,oldName,v);
    replaceShiftKey(ex.compare&&ex.compare.shiftColors,oldName,v);
    ['overview','sidebar'].forEach(k=>{
      const o=ex[k];
      if(!o)return;
      replaceShiftKey(o.shiftNameColors,oldName,v);
      replaceShiftKey(o.shiftRowBgColors,oldName,v);
      if(Array.isArray(o.shiftOrder))o.shiftOrder=o.shiftOrder.map(n=>n===oldName?v:n);
    });
  }
  save();
  if(window.__editingShiftId===id)editGlobalShift(id,true);
}
function editShiftTime(id,key,v){
  const sh=state.globalShifts.find(x=>x.id===id);if(!sh)return;

  sh.time[key]=v;save();
}

function compressImage(file,cb){
  const r=new FileReader();
  r.onload=ev=>{
    const img=new Image();
    img.onload=()=>{
      const size=160,c=document.createElement('canvas');c.width=size;c.height=size;
      const ctx=c.getContext('2d');
      const min=Math.min(img.width,img.height);
      ctx.drawImage(img,(img.width-min)/2,(img.height-min)/2,min,min,0,0,size,size);
      cb(c.toDataURL('image/jpeg',0.78));
    };
    img.src=ev.target.result;
  };
  r.readAsDataURL(file);
}
function savePersonForm(){
  const f=window.__pmForm;
  const name=(f.name||'').trim();
  if(!name){showToast('请输入姓名');return;}
  const baseDate=TODAY_STR;
  if(f.id){
    const p=getPerson(f.id);
    const typeChanged=(p.shiftTypeId!==f.shiftTypeId)||f.__typeChanged;
    p.name=name;p.position=f.position;p.posColor=f.posColor;p.avatar=f.avatar;p.frame=f.frame;
    p.nameColor=f.nameColor;p.shiftTypeId=f.shiftTypeId;p.team=f.team;
    if(typeChanged){
      p.baseIndex=f.baseIndex;p.baseDate=baseDate;
    } else {
      const st=getShiftType(f.shiftTypeId);
      const L=(st&&st.cycle?st.cycle.length:1)||1;
      const b=parseDate(p.baseDate||baseDate);
      const df=Math.floor((new Date()-b)/86400000);
      p.baseIndex=((f.baseIndex-df)%L+L)%L;
    }
  } else {
    if(state.personnel.length>=10){showToast('最多10人');return;}
    const np={id:uid(),name,position:f.position,posColor:f.posColor,avatar:f.avatar,frame:f.frame,nameColor:f.nameColor,shiftTypeId:f.shiftTypeId,team:f.team,baseIndex:f.baseIndex,baseDate:baseDate};
    state.personnel.push(np);
    if(!state.meId)state.meId=np.id;
  }
  window.__pmForm=null;
  save();closeModal();render();showToast('已保存');
}

function doImportPreset(){
  const P = PRESET_PACK;
  const defaultColor = state.theme.primary.type==='solid'?state.theme.primary.color:'#2563eb';

  const st3 = state.shiftTypes.find(s=>s.id==='st3x2');
  if(st3){
    if(!st3.groups)st3.groups=[];
    ['A','B','C'].forEach(g=>{if(st3.groups.indexOf(g)<0)st3.groups.push(g);});
  }
  ['甲','乙','丙','丁','A','B','C'].forEach(name=>{
    if(!getGlobalGroup(name))state.globalGroups.push({id:uid(),name,style:C('#2563eb')});
  });
  ['白班','二班','夜班','休息'].forEach(name=>{
    const exist = getGlobalShift(name);
    if(!exist){
      state.globalShifts.push({id:uid(),name,style:C(name==='休息'?'#ef4444':'#1e293b'),time:{start:'',end:''}});
    } else if(name==='休息'){
      exist.style = C('#ef4444');
    }
  });

  let ap=0;
  (P.personnel||[]).forEach(item=>{
    if(state.personnel.length>=10)return;
    if(state.personnel.find(x=>x.name===item.name))return;
    const st = getShiftType(item.shiftTypeId);
    if(!st)return;
    const L = (st.cycle||[]).length||1;
    const baseIdx = ((item.dayIndex-1)%L+L)%L;
    state.personnel.push({
      id:uid(), name:item.name, position:item.position||'',
      posColor:C('#cbd5e1'),
      avatar:'', frame:-1, nameColor:C(defaultColor),
      shiftTypeId:item.shiftTypeId, team:item.team||'',
      baseIndex:baseIdx, baseDate:TODAY_STR
    });
    ap++;
  });

  let at=0;
  (P.tables||[]).forEach(t=>{
    if(state.tables.find(x=>x.name===t.name))return;
    const groups = t.groups||[];
    const baseIndex = {};
    groups.forEach(g=>{
      const day = (t.todayGroup&&t.todayGroup[g])||1;
      baseIndex[g] = ((day-1)%t.cycleDays+t.cycleDays)%t.cycleDays;
    });
    const dept = {
      id:uid(), name:t.deptName||'默认部门',
      teams: groups.map(gname=>{
        const colorHex = (t.groupColors&&t.groupColors[gname]) || '#2563eb';
        const memberStr = (t.members&&t.members[gname]) || '';
        const members = memberStr ? memberStr.split('、').filter(x=>x!=='') : [];
        return { color:C(colorHex), members:members };
      })
    };
    state.tables.push({
      id:uid(), name:t.name, groups:groups.slice(),
      shiftList:t.shiftList.slice(), cycleDays:t.cycleDays, cycle:t.cycle.slice(),
      baseDate:TODAY_STR, baseIndex:baseIndex,
      departments:[dept], currentDeptId:dept.id
    });
    at++;
  });

  if(!state.sidebarTable && P.sidebarTable){
    const sT = P.sidebarTable;
    const groups = sT.groups||[];
    const baseIndex = {};
    groups.forEach(g=>{
      const day = (sT.todayGroup&&sT.todayGroup[g])||1;
      baseIndex[g] = ((day-1)%sT.cycleDays+sT.cycleDays)%sT.cycleDays;
    });
    const sideTable = {
      id:uid(), name:sT.name, groups:groups.slice(),
      shiftList:sT.shiftList.slice(), cycleDays:sT.cycleDays, cycle:sT.cycle.slice(),
      baseDate:TODAY_STR, baseIndex:baseIndex,
      departments:[], currentDeptId:null
    };
    state.sidebarTable = sideTable;
    state.sidebarTableId = sideTable.id;
  }

  if(!state.meId && state.personnel.length) state.meId = state.personnel[0].id;
  if(!state.currentTableId && state.tables.length) state.currentTableId = state.tables[0].id;

  save(); closeModal(); render();
  showToast('已导入：'+ap+' 人员，'+at+' 套排班表');
}

function _expMonths(sd,ed){
  const arr=[];
  let cur=new Date(sd.getFullYear(),sd.getMonth(),1);
  while(cur<=ed){
    const y=cur.getFullYear();
    const m=cur.getMonth()+1;
    const dim=new Date(y,m,0).getDate();
    arr.push({y,m,dim});
    cur=new Date(y,m,1);
  }
  return arr;
}
function _expTitleRange(sd,ed,label){const y1=sd.getFullYear(),m1=sd.getMonth()+1;const y2=ed.getFullYear(),m2=ed.getMonth()+1;if(y1===y2&&m1===m2)return y1+'年'+m1+'月'+label;if(y1===y2)return y1+'年'+m1+'月～'+m2+'月'+label;return y1+'年'+m1+'月～'+y2+'年'+m2+'月'+label;}
function _expCtx(width,height){const canvas=document.createElement('canvas');const scale=2;canvas.width=width*scale;canvas.height=height*scale;const ctx=canvas.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#fff';ctx.fillRect(0,0,width,height);ctx.textAlign='center';ctx.textBaseline='middle';return {canvas,ctx};}
function _expCell(ctx,x,y,w,h,text,opts){opts=opts||{};if(opts.bg){ctx.fillStyle=opts.bg;ctx.fillRect(x,y,w,h);}if(opts.border!==false){ctx.strokeStyle=opts.borderColor||'#cbd5e1';ctx.lineWidth=1;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);}if(text!==undefined&&text!==null&&text!==''){ctx.fillStyle=opts.color||'#1e293b';ctx.font=(opts.bold?'bold ':'')+(opts.fontSize||12)+'px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText(String(text),x+w/2,y+h/2);}}
function _expMonthTitle(ctx,y,width,text){ctx.fillStyle='#2563eb';ctx.font='bold 13px -apple-system,"PingFang SC","Microsoft YaHei",sans-serif';ctx.fillText(text,width/2,y);}
